  component_version: v0.45.1
release_notes:
- audience: operator
  author:
    hostname: github.com
    type: githubUser
    username: seshachalam-yv
  category: bugfix
  contents: '`etcd-backup-restore` now re-reads the etcd cluster size on every initialization
    instead of only at process startup for multi-node cluster, so a member whose data
    directory is corrupted after a scale-out rejoins the existing cluster as a learner
    instead of restoring from a backup snapshot and bootstrapping a new single-member
    cluster.'
  mimetype: text/markdown
  reference: '[#1080](https://github.com/gardener/etcd-backup-restore/pull/1080)'
  type: standard
