ocm:
  component_name: github.com/gardener/etcd-backup-restore
  component_version: v0.44.0
release_notes:
- audience: user
  author:
    hostname: github.com
    type: githubUser
    username: ishan16696
  category: noteworthy
  contents: Schedule/cron etcd defragmentation can be auto skipped if TotalDBSize
    < 3GB and FreeSpaceAvailable < 1GB (configurable via CLI flag `--freespace-threshold`
    )
  mimetype: text/markdown
  reference: '[#1039](https://github.com/gardener/etcd-backup-restore/pull/1039)'
  type: standard
- audience: user
  author:
    hostname: github.com
    type: githubUser
    username: anveshreddy18
  category: breaking
  contents: 'BREAKING: Removed deprecated support for passing storage endpoint via
    credential secrets for AWS, GCP & Azure. Users must now use the [--store-endpoint-override](https://github.com/gardener/etcd-backup-restore/blob/36243e6fca29ac92342cd5ce92f67462b6e57c06/docs/deployment/getting_started.md?plain=1#L21)
    flag for custom endpoints (emulators, S3-compatible providers, regional endpoints).
    The following credential secret fields are no longer supported: `endpoint` (S3),
    `domain`/`emulatorEnabled` (Azure), `storageAPIEndpoint`/`emulatorEnabled` (GCS).'
  mimetype: text/markdown
  reference: '[#1000](https://github.com/gardener/etcd-backup-restore/pull/1000)'
  type: standard
- audience: dependency
  author:
    hostname: github.com
    type: githubUser
    username: anveshreddy18
  category: other
  contents: Upgrade Go builder to `1.26.5` and bump `grpc` and the AWS SDK to fix
    reported vulnerabilities.
  mimetype: text/markdown
  reference: '[#1054](https://github.com/gardener/etcd-backup-restore/pull/1054)'
  type: standard
- audience: user
  author:
    hostname: github.com
    type: githubUser
    username: priyadharshini-151193
  category: noteworthy
  contents: Remove StatefulSet-based scale-out detection from etcd's initial-cluster-state
    determination; cluster state for multi-node etcd is derived solely from etcd learner
    membership. Respective RBACs has also been removed from helm charts.
  mimetype: text/markdown
  reference: '[#1040](https://github.com/gardener/etcd-backup-restore/pull/1040)'
  type: standard
