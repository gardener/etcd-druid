  contents: Runtime base image bumped from `distroless/static-debian12` to `distroless/static-debian13`.
    The debian12 CA bundle still trusts the roots `emSign ECC Root CA - G3` and `AAA
    Certificate Services`, whose eMudhra intermediate CA keys are publicly recoverable
    (https://emudhra.we-have-a-problem.com/).
